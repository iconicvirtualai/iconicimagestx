[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# Standalone guest-prep sheet. Must stay ahead of any SPA fallback.
[[redirects]]
  from = "/podcast-guest-prep"
  status = 200
  to = "/podcast-guest-prep.html"

[[redirects]]
  from = "/podcast-guest-prep/"
  status = 200
  to = "/podcast-guest-prep.html"
