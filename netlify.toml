[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# Standalone guest-prep sheet. Must stay ahead of any SPA fallback.
[[redirects]]
  from = "/podcast-guest-prep"
  status = 200
  to = "/podcast-guest-prep.html"

[[redirects]]
  from = "/podcast-guest-prep/"
  status = 200
  to = "/podcast-guest-prep.html"

# Holiday campaign pages. Must stay ahead of any SPA fallback.
[[redirects]]
  from = "/thankful"
  status = 200
  to = "/thankful.html"

[[redirects]]
  from = "/thankful/"
  status = 200
  to = "/thankful.html"

[[redirects]]
  from = "/tis-the-season"
  status = 200
  to = "/tis-the-season.html"

[[redirects]]
  from = "/tis-the-season/"
  status = 200
  to = "/tis-the-season.html"

# Retired pricing page. Current prices live on /pricing.
[[redirects]]
  from = "/pricing-v1"
  status = 301
  to = "/pricing"

[[redirects]]
  from = "/pricing-v1/"
  status = 301
  to = "/pricing"

# Bare studio and gallery paths have no project id.
[[redirects]]
  from = "/studio"
  status = 302
  to = "/studio-105"

[[redirects]]
  from = "/studio/"
  status = 302
  to = "/studio-105"

[[redirects]]
  from = "/gallery"
  status = 302
  to = "/portal"

[[redirects]]
  from = "/gallery/"
  status = 302
  to = "/portal"

[[redirects]]
  from = "/december"
  status = 302
  to = "/tis-the-season"

[[redirects]]
  from = "/december/"
  status = 302
  to = "/tis-the-season"

[[redirects]]
  from = "/holiday-packages"
  status = 302
  to = "/tis-the-season"

[[redirects]]
